variables:
  DEPENDENCIES: gettext gettext-devel gcc git meson gtk3-devel yelp-tools
  GIT_SUBMODULE_STRATEGY: normal
  MESON_BUILD_DIR: _build
  TARBALL_ARTIFACT_PATH: "${MESON_BUILD_DIR}/meson-dist/${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.xz"
  UBUNTU_DEPENDENCIES: meson git gcc gettext libtool libnotify-dev libgtk-3-dev libwebkit2gtk-4.1-dev yelp-tools

image: fedora:latest
include:
  - component: gitlab.gnome.org/GNOME/citemplates/release-service@master
    inputs:
      job-stage: release
      dist-job-name: "build-release-tarball"
      tarball-artifact-path: "${TARBALL_ARTIFACT_PATH}"

stages:
  - test
  - release

test:
  stage: test
  before_script:
    - dnf update -y --nogpgcheck
    - dnf install -y --nogpgcheck $DEPENDENCIES
  script:
    - meson setup "${MESON_BUILD_DIR}"
    - meson test -C "${MESON_BUILD_DIR}"
    - DESTDIR=_destdir ninja -C "${MESON_BUILD_DIR}" install

build-release-tarball:
  stage: release
  needs: ["test"]
  before_script:
    - dnf update -y --nogpgcheck
    - dnf install -y --nogpgcheck $DEPENDENCIES
  script:
    - meson setup "${MESON_BUILD_DIR}"
    - meson dist -C "${MESON_BUILD_DIR}"
  artifacts:
    name: "${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}"
    when: always
    paths:
      - "${TARBALL_ARTIFACT_PATH}"
  rules:
    - if: '$CI_COMMIT_TAG'

# Ubuntu image here is mostly to test whether the libnotify/webkitgtk build works

build_ubuntu:
  image: ubuntu:rolling
  before_script:
    - apt-get update
    - apt-get install -q -y --no-install-recommends $UBUNTU_DEPENDENCIES
  script:
    - meson setup --buildtype=debug -Dlibnotify=true -Dwebkitgtk=true build
    - ninja -v -C build
